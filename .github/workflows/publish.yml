name: Publish to npm

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Pinned by commit SHA, not tag. A mutable tag lets whoever controls the
      # action repo change what runs inside a workflow that holds a publish
      # credential - the exact path used by the npm supply-chain campaigns
      # reported this week. Refresh deliberately, not implicitly.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Package smoke test
        run: npm pack --dry-run

      # NOTE: this still authenticates with a long-lived NPM_TOKEN. `id-token:
      # write` above only buys --provenance; the credential itself is a
      # classic token, which is precisely what the current npm supply-chain
      # attacks steal from CI.
      #
      # Migrating to npm trusted publishing (OIDC, no stored token) needs a
      # one-time change on npmjs.com that cannot be made from this repo:
      # link the package to this repository + workflow under
      # Settings -> Trusted Publishers. Removing the token BEFORE that link
      # exists breaks every release, so it stays until the npm side is done.
      # Once it is: drop the `env:` block below and nothing else changes.
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
