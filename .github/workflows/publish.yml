name: Publish to npm

# Manual only: someone runs it from the Actions tab, on main, with the version to publish. It never
# runs on push, tag, release or merge.
# Trusted publishing (OIDC): no npm token is stored anywhere. The `publish` job waits in the `npm`
# environment until the owner approves it under "Review deployments", and only that job gets
# `id-token`. Once it has published, the `tag` job creates the annotated tag v<version> on the
# commit it published, the only job that can write to the repository; the tag triggers nothing.
# No job runs the install scripts of the dependencies (npm ci --ignore-scripts) except `check`,
# which runs better-sqlite3's alone, for its native binary.
# src/publish-workflow.test.ts fails if any of that stops being true.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish; must equal package.json"
        required: true
        type: string

permissions:
  contents: read # the job that publishes adds id-token itself

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    name: Check version and tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions pinned by commit SHA, not tag: a mutable tag lets whoever controls the action repo
      # change what runs inside the workflow that publishes. Refresh deliberately.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: The input version must be the package version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          pkg=$(node -p "require('./package.json').version")
          if [ "$INPUT_VERSION" != "$pkg" ]; then
            echo "::error::input $INPUT_VERSION, package.json $pkg"
            exit 1
          fi

      - run: npm ci --ignore-scripts

      # better-sqlite3 (a devDependency: src/reputation/outbox.test.ts opens real databases) has
      # no native binary until its install script runs. This job, which can only read, runs that
      # one script, from the tarball the lock pins; the prebuilt binary it downloads from the
      # package's GitHub release is not in the lock. `publish` and `tag` run no install script.
      - run: npm rebuild better-sqlite3

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Package smoke test
        run: npm pack --dry-run

  publish:
    name: Publish to npm
    needs: check
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 20
    permissions:
      contents: read # checkout
      id-token: write # trusted publishing (OIDC) and provenance, only in this job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: npm must support trusted publishing (>= 11.5.1)
        run: |
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)" \
            || { echo "::error::npm $(npm --version) cannot publish with OIDC"; exit 1; }

      - run: npm ci --ignore-scripts

      # npm exchanges this job's OIDC token for a short-lived publish credential, which works only
      # while npmjs.com lists this repository and publish.yml as the package's trusted publisher.
      # There is no token to add here. prepublishOnly re-runs the gates and builds dist/ first.
      # This job runs no install script, so better-sqlite3 has no binary here: the variable lets
      # src/reputation/outbox.test.ts skip the suites that need it, which `check` ran on this commit.
      - name: Publish
        env:
          UVD_SKIP_SQLITE_WITHOUT_BINARY: '1'
        run: npm publish --provenance --access public

  # Runs only when `publish` succeeded (no `if` of its own). The run's commit is the one `check`
  # tested and `publish` published (no checkout here names another ref), so that is the commit the
  # tag goes on, and only once npm shows the version with that commit as its gitHead. If
  # v<version> is already on it, the job passes; if it is on another commit, the job fails and
  # moves nothing. npm already has the version by then: what to fix is the tag, not the package.
  # A failed run of this job can be re-run on its own, without a second approval.
  tag:
    name: Tag the published version
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # the tag; no id-token, and no npm install runs in this job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      # Checks package.json at the run's commit against the input and that npm has that version
      # from that commit (gitHead), then creates the tag object and refs/tags/v<version> through
      # the GitHub API with this job's token. Its env is exactly these two.
      - name: Tag v<version> on the published commit
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/tag-release.mjs
