name: CI

on:
  push:
    branches: [main]
    # Runs only when a file the jobs below read changes. A change to nothing
    # on this list (docs/, CHANGELOG.md, the scripts CI never runs) cannot
    # change the result, so it does not spend a run. When a job starts reading
    # a new file, add it here in the same PR. Why each entry:
    #   src/**            code, tests, fixtures and vectors: typecheck, test,
    #                     lint and build read them, and both conformance
    #                     scripts load their vectors from src/
    #   README.md         src/readme-eurc-table.test.ts parses its EVM table,
    #                     and `npm pack` ships it
    #   LICENSE           `npm pack` ships it
    #   package.json      `npm ci`, every `npm run`, and `files` for `npm pack`
    #   package-lock.json `npm ci` installs exactly this tree
    #   tsconfig*.json    typecheck (tsconfig.json), lint (tsconfig.eslint.json)
    #   *.config.*        lint (eslint.config.mjs), build (tsup.config.ts);
    #                     vitest also picks up a vitest/vite config from here
    #   .gitattributes    checkout applies it, and it pins the bytes of the
    #                     ERC-8128 vectors that the tests and the
    #                     cross-language job hash
    #   scripts/derive-erc8128-f3-3.mjs  "Vectors are the same file" step
    #   scripts/xlang/**  the cross-language step and the agents it spawns
    #   .github/workflows/ci.yml         this file
    paths: &ci-paths
      - 'src/**'
      - 'README.md'
      - 'LICENSE'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '*.config.*'
      - '.gitattributes'
      - 'scripts/derive-erc8128-f3-3.mjs'
      - 'scripts/xlang/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths: *ci-paths

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Package smoke test
        run: npm pack --dry-run

  # The one check neither language's own suite can make. Both SDK suites were
  # green while the implementations diverged, because each validated itself
  # against vectors it had generated. This job spawns BOTH runtimes and makes
  # each verify what the other just signed. It has NO `continue-on-error` and
  # the script has no skip path: if Python is unavailable, the job fails.
  cross-language:
    name: Cross-language conformance (TS ↔ PY)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the Python SDK beside this repo
        uses: actions/checkout@v4
        with:
          repository: UltravioletaDAO/uvd-x402-sdk-python
          path: .sibling/uvd-x402-sdk-python

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the TypeScript SDK
        run: npm ci

      - name: Install the Python SDK from the sibling checkout
        run: pip install -e '.[signer]'
        working-directory: .sibling/uvd-x402-sdk-python

      # The agent imports dist/, not src/: a divergence that only appears after
      # bundling is still a divergence.
      - name: Build
        run: npm run build

      # The one artefact, byte for byte, in both packages.
      - name: Vectors are the same file in both repos
        env:
          UVD_X402_PY_ROOT: ${{ github.workspace }}/.sibling/uvd-x402-sdk-python
        run: node scripts/derive-erc8128-f3-3.mjs --check

      - name: Sign in each runtime, verify in the other
        env:
          UVD_X402_PY_ROOT: ${{ github.workspace }}/.sibling/uvd-x402-sdk-python
          UVD_PYTHON: python
        run: node scripts/xlang/cross-language-conformance.mjs
